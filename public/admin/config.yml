    - {name: windowWidth, label: Window width, widget: select, required: false, options: [{label: Narrow, value: narrow}, {label: Medium, value: medium}, {label: Wide, value: wide}, {label: Full screen, value: full}], hint: 'Leave empty for the default (entries are medium, projects are wide).'}
    hint: Background and width for this page only.
  - name: blocks
    label: Page layout blocks
    label_singular: Block
    widget: list
    required: false
    typeKey: type
    collapsed: auto
    summary: '{{fields.type}}'
    hint: Build the page from blocks, top to bottom. Use the arrows to reorder them. They appear below the Text above.
    types:
    - name: content
      label: Text and media
      widget: object
      summary: '{{fields.text}}'
      fields:
      - {name: text, label: Text, widget: markdown, required: false}
      - name: media
        label: Pictures, videos, sound
        label_singular: Media item
        widget: list
        required: false
        collapsed: auto
        summary: '{{fields.caption}} {{fields.src}}'
        thumbnail: src
        hint: Shown beside or above/below the text. Leave empty for a text-only block, or leave the text empty to show only media.
