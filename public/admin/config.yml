        - {name: image, label: Backdrop picture, widget: image, required: false, hint: Optional picture drawn behind the text or media.}
        - {name: imageMode, label: Backdrop picture layout, widget: select, options: [{label: Repeat as tiles, value: tile}, {label: Cover the whole box, value: cover}, {label: Fit inside, value: contain}, {label: 'Centre, original size', value: center}], default: tile, required: false}
