        - {name: x, label: Move right (px), widget: number, value_type: int, min: -1500, max: 1500, default: 0, required: false, hint: Negative numbers move it left.}
        - {name: y, label: Move down (px), widget: number, value_type: int, min: -1500, max: 1500, default: 0, required: false, hint: Negative numbers move it up.}
        - {name: width, label: Width (px), widget: number, value_type: int, min: 8, max: 1600, default: 140, required: false, hint: Shrinks to 60% on phones.}
        - {name: rotate, label: Rotate (degrees), widget: number, value_type: int, min: -180, max: 180, default: 0, required: false}
        - {name: opacity, label: Opacity (%), widget: number, value_type: int, min: 0, max: 100, default: 100, required: false}
        - {name: flip, label: Mirror left to right, widget: boolean, default: false, required: false}
        - {name: layer, label: Layer, widget: select, options: [{label: Behind the backdrop, value: behind}, {label: 'On the backdrop, behind the text', value: middle}, {label: In front of everything, value: front}], default: front, required: false}
    - name: buttons
      label: Buttons (links)
      widget: object
      summary: Buttons
      fields:
      - name: items
        label: Buttons
        label_singular: Button
        widget: list
        required: false
        summary: '{{fields.label}}'
        collapsed: auto
        fields:
        - {name: label, label: Label, widget: string, required: false}
        - {name: url, label: Link, widget: string, required: false, hint: 'A full web address, mailto: link, or a page on this site such as /projects/jojo-foolery/'}
        - {name: newTab, label: Open in a new tab, widget: boolean, default: false, required: false}
      - {name: align, label: Position, widget: select, options: [{label: Left, value: left}, {label: Centre, value: center}, {label: Right, value: right}], default: center, required: false}
      - name: style
        label: Block backdrop and position
        widget: object
        required: true
        collapsed: true
        fields:
        - {name: backdrop, label: Backdrop, widget: select, options: [{label: None, value: none}, {label: White panel (sunken), value: panel}, {label: Grey panel (raised), value: raised}, {label: Window with title bar, value: window}, {label: Flat colour, value: flat}, {label: Outline only, value: outline}, {label: Dashed outline, value: dashed}], default: none, required: false, hint: What sits behind it. "Window" draws a Windows 95 window with a title bar.}
        - {name: title, label: Window title, widget: string, required: false, hint: Only used by the "Window with title bar" backdrop.}
        - {name: color, label: Backdrop colour, widget: color, allowInput: true, required: false, hint: Leave empty for the backdrop's normal colour. For outlines this is the line colour.}
