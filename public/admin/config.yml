- name: entries
  label: Entries
  label_singular: Entry
  folder: src/content/entries
  path: '{{project}}/{{slug}}'
  extension: md
  format: frontmatter
  create: true
  slug: '{{title}}'
  media_folder: /public/media
  public_folder: /media
  summary: '{{title}} ({{project}})'
  fields:
  - {name: project, label: Project, widget: relation, collection: projects, value_field: '{{slug}}', search_fields: [title], display_fields: [title], hint: Which project this entry belongs to. Changing it later does not move the entry.}
  - {name: title, label: Title, widget: string}
  - {name: summary, label: Short summary, widget: text, required: false}
  - {name: date, label: Date, widget: datetime, date_format: YYYY-MM-DD, time_format: false}
  - {name: categories, label: Categories, widget: relation, collection: categories, value_field: '{{slug}}', search_fields: [title], display_fields: [title], multiple: true, required: false, hint: Pick one or more. The entry is listed under each of them on the project page. Use "Add Category" to create a new one.}
  - name: keyPoints
    label: Key points
    widget: list
    required: false
    field: {name: keyPoint, label: Key point, widget: string}
    hint: Groups on the main page, for example Battlegrounds moves.
  - {name: thumbnail, label: Thumbnail, widget: image, required: false, media_folder: /src/assets/uploads, public_folder: ../../../assets/uploads}
  - {name: draft, label: Draft (hidden on the live site), widget: boolean, default: false}
  - {name: gradientTop, label: Title bar colour (top), widget: color, required: false, hint: Leave empty to use the project's colours.}
  - {name: gradientBottom, label: Title bar colour (bottom), widget: color, required: false}
  - {name: body, label: Text, widget: markdown, required: false, hint: Plain text in a white box at the top of the page. Leave empty to skip it and use only the blocks below.}
  - name: page
